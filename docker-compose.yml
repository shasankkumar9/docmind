services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: docmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  qdrant-data: